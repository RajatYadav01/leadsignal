services:
  leadsignal-database:
    container_name: leadsignal-database
    image: postgres:18
    environment:
      - POSTGRES_DB=leadsignal
      - POSTGRES_USER=leadsignal
      - POSTGRES_PASSWORD=12514199
    volumes:
      - leadsignal_db_data:/var/lib/postgresql
    ports:
      - "5440:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "leadsignal"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - leadsignal

  leadsignal-api-v1:
    container_name: leadsignal-api-v1
    build:
      context: .
      dockerfile: apps/api/v1/Dockerfile
    ports:
      - "8010:8000"
    depends_on:
      leadsignal-database:
        condition: service_healthy
    environment:
      - DEBUG=False
      - SECRET_KEY=leadsignal-secret-key-123456789
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - CORS_ALLOWED_ORIGINS=http://localhost:5174,http://127.0.0.1:5174,http://0.0.0.0:5174
      - APP_HOST_URL=http://localhost:5174
      - DATABASE_URL=postgresql://leadsignal:12514199@leadsignal-database:5432/leadsignal
    volumes:
      - ./apps/api:/app
    networks:
      - leadsignal

  leadsignal-web:
    container_name: leadsignal-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - VITE_BASE_URL=/
        - VITE_API_URL=http://localhost:8010/api/v1
    ports:
      - "5174:80"
    depends_on:
      - leadsignal-api-v1
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    networks:
      - leadsignal

volumes:
  leadsignal_db_data:

networks:
  leadsignal:
    driver: bridge
