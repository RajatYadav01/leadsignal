name: Deploy Backend API v1 App

on:
  workflow_run:
    workflows: ["All Checks"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy-backend-api-v1-app:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: backend-api-v1-deploy
      cancel-in-progress: false

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_V1_APP_PROJECT_ID }}

    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up uv (Python Package Manager)
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
          cache-dependency-glob: "apps/api/v1/pyproject.toml"

      - name: Install API dependencies
        run: |
          uv venv apps/api/v1/.venv
          cd apps/api/v1
          uv sync --group dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add -g vercel

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Prebuilt Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Run Django migrations
        run: uv run python manage.py migrate --noinput
        working-directory: apps/api/v1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
